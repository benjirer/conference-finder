# Render Blueprint (https://render.com/docs/blueprint-spec).
# After pushing to GitHub, go to https://dashboard.render.com → New → Blueprint,
# point it at the repo, and Render will create the service from this file.
#
# Merged venue snapshots live in Git. The runtime database is rebuilt in the
# background on startup. Scheduled official-page checks run in GitHub Actions.

services:
  - type: web
    name: conference-finder
    runtime: python
    plan: free
    region: frankfurt        # closest free region for Switzerland; switch to oregon/singapore if elsewhere
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    # This free blueprint has ephemeral storage. For durable user additions,
    # mount persistent storage and set CONFERENCE_FINDER_DATA_DIR to its path.
    envVars:
      - key: CONFERENCE_FINDER_REFRESH_HOURS
        value: "6"
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: CONFERENCE_FINDER_OFFICIAL_ENABLED
        value: "0"
      - key: CONFERENCE_FINDER_GITHUB_REPO
        value: "benjirer/conference-finder"
      - key: CONFERENCE_FINDER_GITHUB_TOKEN
        sync: false
      - key: CONFERENCE_FINDER_OFFICIAL_HOURS
        value: "24"
      - key: CONFERENCE_FINDER_OFFICIAL_LIMIT
        value: "0"
      - key: ANTHROPIC_API_KEY
        sync: false           # set this manually in the Render dashboard for official-page checks and Add venue
